<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EstudiaBot - Tu Ayudante de Estudios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; }
    .chat-container { height: calc(100vh - 180px); }
    .message { max-width: 80%; }
  </style>
</head>
<body class="bg-gray-950 text-white">
  <div class="max-w-5xl mx-auto p-4">
    <header class="flex items-center justify-between mb-6 border-b border-gray-800 pb-4">
      <div class="flex items-center gap-3">
        <i class="fas fa-graduation-cap text-4xl text-blue-500"></i>
        <div>
          <h1 class="text-3xl font-bold">EstudiaBot</h1>
          <p class="text-gray-400 text-sm">Tu asistente inteligente para estudiar</p>
        </div>
      </div>
      <div class="text-sm text-gray-400">
        Modelo: Gemini 1.5 Flash
      </div>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <!-- Sidebar -->
      <div class="md:col-span-1 bg-gray-900 rounded-2xl p-5">
        <h2 class="font-semibold mb-4 flex items-center gap-2">
          <i class="fas fa-book"></i> Temas rápidos
        </h2>
        <div class="space-y-2 text-sm">
          <button onclick="quickPrompt('Hazme un resumen claro de [tema]')" class="w-full text-left px-4 py-3 hover:bg-gray-800 rounded-xl">📝 Resumen</button>
          <button onclick="quickPrompt('Explícame [concepto] como si tuviera 15 años')" class="w-full text-left px-4 py-3 hover:bg-gray-800 rounded-xl">🧠 Explicación simple</button>
          <button onclick="quickPrompt('Crea 5 preguntas de opción múltiple sobre [tema] con respuestas')" class="w-full text-left px-4 py-3 hover:bg-gray-800 rounded-xl">❓ Ejercicios</button>
          <button onclick="quickPrompt('Haz un mapa conceptual de [tema]')" class="w-full text-left px-4 py-3 hover:bg-gray-800 rounded-xl">🗺️ Mapa conceptual</button>
          <button onclick="quickPrompt('Dame un plan de estudio de 7 días para [asignatura]')" class="w-full text-left px-4 py-3 hover:bg-gray-800 rounded-xl">📅 Plan de estudio</button>
        </div>
      </div>

      <!-- Chat -->
      <div class="md:col-span-3 bg-gray-900 rounded-3xl flex flex-col">
        <div id="chat" class="chat-container overflow-y-auto p-6 space-y-6"></div>

        <div class="p-6 border-t border-gray-800">
          <div class="flex gap-3">
            <input 
              id="userInput" 
              type="text" 
              placeholder="Pregúntame cualquier cosa sobre estudios... (ej: resumen de fotosíntesis)"
              class="flex-1 bg-gray-800 rounded-2xl px-6 py-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
              onkeypress="if(event.key === 'Enter') sendMessage()">
            <button 
              onclick="sendMessage()"
              class="bg-blue-600 hover:bg-blue-700 px-8 rounded-2xl transition">
              <i class="fas fa-paper-plane"></i>
            </button>
          </div>
          <p class="text-center text-xs text-gray-500 mt-3">
            ⚠️ No compartas tu clave API con nadie
          </p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyC3nepA__XgmlBdkUBT5SpCFvVopEWQfEY";
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

    // System prompt educativo
    let conversationHistory = [
      {
        role: "user",
        parts: [{ text: "Eres EstudiaBot, un tutor experto, paciente y motivador. Ayudas con resúmenes, explicaciones, ejercicios, planes de estudio y cualquier cosa relacionada con el aprendizaje. Siempre respondes en español." }]
      }
    ];

    function addMessage(text, isUser) {
      const chat = document.getElementById("chat");
      const div = document.createElement("div");
      div.className = `flex ${isUser ? 'justify-end' : 'justify-start'} message`;
      
      div.innerHTML = `
        <div class="${isUser ? 'bg-blue-600' : 'bg-gray-800'} rounded-3xl px-6 py-4">
          ${isUser ? '' : '<i class="fas fa-robot text-blue-400 mb-2 block"></i>'}
          <p class="whitespace-pre-wrap">${text}</p>
        </div>
      `;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("userInput");
      const message = input.value.trim();
      if (!message) return;

      addMessage(message, true);
      input.value = "";

      // Mostrar "escribiendo..."
      const loadingId = "loading-" + Date.now();
      const chat = document.getElementById("chat");
      chat.innerHTML += `
        <div id="${loadingId}" class="flex justify-start">
          <div class="bg-gray-800 rounded-3xl px-6 py-4">
            <i class="fas fa-spinner fa-spin"></i> Pensando...
          </div>
        </div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        conversationHistory.push({
          role: "user",
          parts: [{ text: message }]
        });

        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: conversationHistory,
            generationConfig: {
              temperature: 0.7,
              maxOutputTokens: 2048,
            }
          })
        });

        const data = await response.json();
        
        // Eliminar mensaje de cargando
        document.getElementById(loadingId).remove();

        if (data.candidates && data.candidates[0].content) {
          const reply = data.candidates[0].content.parts[0].text;
          addMessage(reply, false);
          
          conversationHistory.push({
            role: "model",
            parts: [{ text: reply }]
          });
        } else {
          addMessage("Lo siento, hubo un error al procesar tu solicitud.", false);
        }
      } catch (error) {
        document.getElementById(loadingId).remove();
        addMessage("Error de conexión. Revisa tu clave API o internet.", false);
        console.error(error);
      }
    }

    function quickPrompt(text) {
      document.getElementById("userInput").value = text;
      sendMessage();
    }

    // Mensaje de bienvenida
    window.onload = () => {
      addMessage("¡Hola! Soy <strong>EstudiaBot</strong> 👋<br>¿En qué te ayudo hoy? Puedo hacer resúmenes, explicarte temas, crear ejercicios, planes de estudio, etc.", false);
    };
  </script>
</body>
</html>
